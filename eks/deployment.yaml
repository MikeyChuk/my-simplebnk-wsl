apiVersion: apps/v1
kind: Deployment

metadata:
  name: simple-bank-api-deployment
  labels:
    app: simple-bank-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: simple-bank-api

  template:
    metadata:
      labels:
        app: simple-bank-api

    spec:
      containers:
      - name: simple-bank-api
        image: 303974373405.dkr.ecr.eu-west-1.amazonaws.com/simplebank:77c93175c6149cb83bdfd22cc39a487bff67cc4d

        ports:
        - containerPort: 8080